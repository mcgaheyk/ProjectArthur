# ProjectArthur display configuration. The one place for colours, thresholds, timings and
# captions. Loaded by arthur/config.py into frozen dataclasses.

[display]
# Frame size: the Ulanzi TC002's 52x16 matrix (the only size the renderer supports).
size = "52x16"
# Local time zone (an IANA name): the night quiet hours and the date on the weather page.
timezone = "America/New_York"

# Semantic colour roles. Screens and icons refer to roles, never to hex values.
# The scheme is warm (Kyle's office is reddish, Arthur is orange). A light, soapy blue is the one
# cool accent and is reserved for the robot cleaning and "fresh". Trouble is red.
[palette]
off       = "#000000"  # unlit
text      = "#FFE4C4"  # warm white: words and digits
dim       = "#3A2E26"  # gauge tracks, secondary marks
ok        = "#00D040"  # green: litter level OPTIMAL (the robot's own word); the vacant door
attention = "#FFA000"  # amber: needs a look soon (interrupted, bonnet, paused)
alert     = "#FF1818"  # red: trouble (faults, drawer full, no data, offline)
fur       = "#FF7A00"  # Arthur: bright orange body
stripe    = "#8C2000"  # Arthur: darker orange tabby stripes, closed eyes
cream     = "#FFD8A0"  # Arthur: muzzle, chest and paws; hourglass frame; moon
nose      = "#FF5C8A"  # Arthur: pink nose
eye       = "#38E038"  # Arthur: green eyes
poop      = "#683010"  # the poop emoji: brown (kept dark so it never reads as Arthur's orange)
poop_hi   = "#A86028"  # the poop emoji: lighter highlight
gold      = "#FFC828"  # waiting digits, power and emptying
sand      = "#E09020"  # hourglass sand; the litter bar when the robot gives no litter word
soap      = "#38B6FF"  # the one cool accent: a light, fun, soapy blue for cleaning and "fresh"
soap_hi   = "#B8ECFF"  # pale bubble highlight on the soapy blue (the cleaning ring's bubbles)
stink     = "#A8D020"  # stink lines: a sickly yellow-green, used for nothing else
ghost     = "#686868"  # grey ghost Arthur: we do not know what he is doing
stale     = "#6E0700"  # the clock's own out-of-date border (AWTRIX NG lifetimeExpiry "mark")
drawer    = "#FF9800"  # the waste-drawer bar while it has room (red from drawer_warn_pct)
caution   = "#FFE020"  # yellow: litter needs topping up (REFILL), or is overfilled (OVERFILL)
rat       = "#A8A8B0"  # the idle show's rat: a cool grey
bird      = "#40B0FF"  # the idle show's bird: a bright blue
cloud     = "#C8D0E0"  # the weather page's clouds: a pale grey-blue

# One character per role. Icon text-art files and the text preview use these.
# "." is also "transparent" in icons; "*" in an icon means "the accent role the screen picks";
# "%" is a level-fill cell.
[palette_chars]
off       = "."
text      = "W"
dim       = ":"
ok        = "G"
attention = "Y"
alert     = "R"
fur       = "O"
stripe    = "S"
cream     = "C"
nose      = "N"
eye       = "E"
poop      = "B"
poop_hi   = "H"
gold      = "A"
sand      = "s"
soap      = "b"
soap_hi   = "i"
stink     = "K"
ghost     = "g"
stale     = "x"
drawer    = "D"
caution   = "U"
rat       = "r"
bird      = "v"
cloud     = "c"

[thresholds]
drawer_warn_pct = 80  # the drawer bar turns from orange to red from here
# The litter bar is full at 100 % and down to its 2-pixel stub at this percentage. The robot's
# own scale does not read as empty where it matters: it said OPTIMAL down to 76 % and LOW at
# 72 %. 60 is a guess at "basically empty"; no EMPTY reading has been seen yet.
litter_empty_pct = 60

[timings]
heartbeat_s = 30              # feeder re-pushes at least this often
ttl_s = 90                    # lifetimeMs sent with each push (three heartbeats, D-0004)
just_cleaned_s = 5            # READY within this long after CLEAN_CYCLE shows just_cleaned
# Timed progress estimate for cleaning. Ten real cycles on 2026-11-16 and 17 took 123-134 s
# (median 131) from CLEAN_CYCLE to READY.
clean_cycle_estimate_s = 130
no_data_after_s = 600         # no successful contact for this long shows no_data
# A visit with no pet-weight update this long after detection shows waiting with no
# countdown ("WAIT"). In the seven real visits the weight came 48-86 s after detection.
cat_left_fallback_s = 120
# A detection counts as a visit (moves the last-visit time) once a weight arrives or it has
# lasted this long. Real visits ran 9 min or more; blips and manual cleans 2-14 s.
visit_min_s = 30
# How often the feeder polls Whisker beside the live connection; never under 120 s whatever
# is set here. Whisker's API is unofficial: no faster than every few minutes.
poll_s = 300
in_use_joke_s = 6             # in use: seconds of the joke page (poop emoji, joke, IN USE)
in_use_cat_s = 4              # in use: seconds of the cat page (Arthur, timer, drawer bar)
interrupted_title_s = 2       # interrupted: seconds of INTERRUPTION in each episode
interrupted_phrase_s = 3      # interrupted: seconds of the second phrase in each episode
interrupted_rest_s = 2        # interrupted: seconds of the empty globe before he walks in again

# The idle show (D-0019): idle takes turns between the home page, the weather and date page
# and a short scene, in rounds lined up with the wall clock. The intended shares are 30 (page)
# and 20 (scene); they stay 0 until the idle show goes live, which leaves idle on the home page.
[idle]
round_s = 180                 # length of one round, seconds
page_pct = 0                  # share of each round for the weather and date page, 0-100 (0 = off)
scene_pct = 0                 # share of each round for a scene, 0-100 (0 = off)
# page_pct and scene_pct together are at most 90; the home page keeps the rest.
settle_s = 45                 # no page or scene starts until idle has lasted this long
# Night, in the local time zone: Arthur sleeps on the home page and there are no scenes.
# Whole hours 0-23; the same hour twice means no quiet hours.
quiet_from_h = 22
quiet_until_h = 7

# Where the weather page's forecast is for: Boston, the city centre.
[weather]
latitude = 42.36              # decimal degrees, north positive
longitude = -71.06            # decimal degrees, east positive (west is negative)
refresh_s = 900               # fetch the forecast this often; never under 300
max_age_s = 2700              # a forecast older than this is not shown; at least refresh_s

# Captions are jokes. One is picked per visit (from when the state began), so it stays put for
# the whole visit and changes between visits. Add your own; a caption too wide for its line
# is skipped, never cut off (the tests list any that do not fit).
# Rough widths: most letters are 4 px, M and W 6, I ! : and space 2.
[captions]
# in use, the joke page's headline beside the poop emoji, big font: up to 31 px (about 7
# letters). Unlike the others these take turns: a new one each time the joke page comes round,
# in an order shuffled once per visit, so all of them show before any repeats.
in_use = ["IN SESH", "NO PEEK", "POOPIN?", "PEEIN?", "THRONE", "VIP ONLY"]
# waiting, top line above the countdown: up to 31 px
waiting = ["CLEAN IN"]
# waiting while the robot sleeps: headline, up to 31 px in the big font
waiting_sleep = ["ZZZ", "SNOOZE", "NAPPING", "SLEEPY", "LATER"]
# cleaning, small line under the countdown, inside the soapy ring: up to 34 px
cleaning = ["CLEANING"]
# just cleaned, big word under a small "FRESHLY", up to 31 px
just_cleaned = ["CLEANED"]
# interrupted, the second phrase of each episode (after the fixed title "INTERRUPTION", which
# is not listed here): big font across the full width, up to 50 px, a new one each episode
interrupted_look = ["TAKIN' A LOOK", "JUST LOOKING", "OOH IT SPINS", "INSPECTING", "SUPERVISING",
                    "IS IT DONE?", "QUICK LOOK"]
# drawer full, small line under FULL, inside the flashing ring: up to 34 px, drawn with narrow
# 3-px M and W (so here M and W count 4 px, like most letters)
drawer_full = ["EMPTY NOW"]
