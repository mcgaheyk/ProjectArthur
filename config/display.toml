# ProjectArthur display configuration. The one place for colours, thresholds, timings and
# captions. Loaded by arthur/config.py into frozen dataclasses.

[display]
# Frame size: the Ulanzi TC002's 52x16 matrix (the only size the renderer supports).
size = "52x16"

# Semantic colour roles. Screens and icons refer to roles, never to hex values.
# The scheme is warm (Kyle's office is reddish, Arthur is orange). Mint is the one cool accent
# and is reserved for the robot cleaning and "fresh". Trouble is red.
[palette]
off       = "#000000"  # unlit
text      = "#FFE4C4"  # warm white: words and digits
dim       = "#3A2E26"  # gauge tracks, secondary marks
ok        = "#00D040"  # green: litter level OPTIMAL (the robot's own word); the vacant door
attention = "#FFA000"  # amber: needs a look soon (interrupted, bonnet, paused)
alert     = "#FF1818"  # red: trouble (faults, drawer full, no data, offline)
fur       = "#FF7A00"  # Arthur: bright orange body
stripe    = "#8C2000"  # Arthur: darker orange tabby stripes, closed eyes
cream     = "#FFD8A0"  # Arthur: muzzle, chest and paws; hourglass frame; moon
nose      = "#FF5C8A"  # Arthur: pink nose
eye       = "#38E038"  # Arthur: green eyes
poop      = "#683010"  # the poop emoji: brown (kept dark so it never reads as Arthur's orange)
poop_hi   = "#A86028"  # the poop emoji: lighter highlight
gold      = "#FFC828"  # waiting digits, power and emptying
sand      = "#E09020"  # hourglass sand; the litter bar when the robot gives no litter word
mint      = "#30FFB0"  # the one cool accent: cleaning and "fresh"
stink     = "#A8D020"  # stink lines: a sickly yellow-green, used for nothing else
ghost     = "#686868"  # grey ghost Arthur: we do not know what he is doing
stale     = "#6E0700"  # the clock's own out-of-date border (AWTRIX NG lifetimeExpiry "mark")
drawer    = "#FF9800"  # the waste-drawer bar while it has room (red from drawer_warn_pct)
caution   = "#FFE020"  # yellow: litter needs topping up (REFILL), or is overfilled (OVERFILL)

# One character per role. Icon text-art files and the text preview use these.
# "." is also "transparent" in icons; "*" in an icon means "the accent role the screen picks";
# "%" is a level-fill cell.
[palette_chars]
off       = "."
text      = "W"
dim       = ":"
ok        = "G"
attention = "Y"
alert     = "R"
fur       = "O"
stripe    = "S"
cream     = "C"
nose      = "N"
eye       = "E"
poop      = "B"
poop_hi   = "H"
gold      = "A"
sand      = "s"
mint      = "M"
stink     = "K"
ghost     = "g"
stale     = "x"
drawer    = "D"
caution   = "U"

[thresholds]
drawer_warn_pct = 80  # drawer_nearly_full badge, and the drawer bar turns from orange to red

[timings]
heartbeat_s = 30              # feeder re-pushes at least this often
ttl_s = 90                    # lifetimeMs sent with each push (three heartbeats, D-0004)
just_cleaned_s = 60           # READY within this long after CLEAN_CYCLE shows just_cleaned
clean_cycle_estimate_s = 150  # timed progress estimate for cleaning (library has no phases)
no_data_after_s = 600         # no successful contact for this long shows no_data
idle_blink_every_s = 30       # idle Arthur blinks (or flicks his tail) once per this many s

# Captions are jokes. One is picked per visit (from when the state began), so it stays put for
# the whole visit and changes between visits. Add your own; a caption too wide for its line
# is skipped, never cut off (the tests list any that do not fit).
# Rough widths: most letters are 4 px, M and W 6, I ! : and space 2.
[captions]
# in use, headline beside the poop emoji, big font: up to 31 px (about 7 letters)
in_use = ["PLOP?", "BUSY", "IN SESH", "NO PEEK", "POOPIN?", "PEEIN?", "BRB", "SHH!",
          "PRIVACY", "WORKIN", "THRONE", "VIP ONLY"]
# waiting, label variant, top line: up to 31 px
waiting = ["FLUSH IN", "CLEAN IN", "SPIN IN", "SCOOP IN", "SIFT IN"]
# waiting while the robot sleeps: headline, up to 31 px in the big font
waiting_sleep = ["ZZZ", "SNOOZE", "NAPPING", "SLEEPY", "LATER"]
# cleaning, second line under the countdown: up to 31 px
cleaning = ["SPINNING", "FLUSHING", "WHEEE", "TUMBLE", "SIFTING", "SWOOSH", "DIZZY"]
# just cleaned headline, big font, up to 31 px
just_cleaned = ["FRESH!", "SPARKLY", "SO FRESH", "SHINY", "SO NICE", "AHHH"]
# interrupted headline, big font, up to 31 px
interrupted = ["HEY!", "OI!", "WAIT!", "HOLD UP", "NOPE!", "RUDE!", "UH OH"]
# drawer full, small line under FULL, inside the flashing ring: up to 34 px, drawn with narrow
# 3-px M and W (so here M and W count 4 px, like most letters)
drawer_full = ["EMPTY NOW"]
