[project]
name = "arthur"
version = "0.1.0"
description = "Litter-Robot 4 status display: feeder, renderer and simulator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.14.5",
    "pylitterbot>=2025.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arthur"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".claude"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
